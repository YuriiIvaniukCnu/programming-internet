<body>
    <a href="../lab6.html" style="position: fixed; top: 10px; right: 10px;">Назад</a>
    <h1>Завдання №3</h1>
    <h3>Функція, яка приймає рядок і символ, і повертає індекс першого входження цього символу в рядку (або -1, якщо не знайдено).</h3>

    <form style="display: flex; flex-direction: column; width: 300px;">
        <label for="text">Рядок:</label>
        <input type="text" id="text"> <br>

        <label for="symbol">Символ:</label>
        <input type="text" id="symbol" maxlength="1"> <br>

        <input type="button" value="Знайти індекс" id="findButton"> <br>

        <label for="output">Індекс:</label>
        <input type="text" id="output" readonly>
    </form>
</body>
</html>
