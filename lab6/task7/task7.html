<body>
    <a href="../lab6.html" style="position: fixed; top: 10px; right: 10px;">Назад</a>
    <h1>Завдання №7</h1>
    <h3>Функція скорочення рядка. Якщо довжина рядка більша за максимальну, зайві символи відкидаються і додаються три крапки (вони рахуються до максимальної довжини).</h3>
    <p>truncate("Hello, world!", 8) має повернути "Hello..."</p>

    <form style="display: flex; flex-direction: column; width: 300px;">
        <label for="text">Рядок:</label>
        <input type="text" id="text"> <br>

        <label for="maxLength">Максимальна довжина:</label>
        <input type="number" id="maxLength" min="3"> <br>

        <input type="button" value="Скоротити" id="truncateButton"> <br>

        <label for="output">Результат:</label>
        <input type="text" id="output" readonly>
    </form>
</body>
</html>
