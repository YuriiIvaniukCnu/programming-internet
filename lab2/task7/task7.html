<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання №7</title>

</head>

<body>
    <a href="../lab2.html" style="position: fixed; top: 10px; right: 10px;">Назад</a>
    <h1>Завдання №7</h1>
    <script>
        let names = ["Anna", "Bob", "Emma", "John", "Mike", "Chad", "Mike", "Ivan", "Yura"];
        let vowels = "AEIOU";

        for (let i = 0; i < names.length; i++) {
            let firstLetter = names[i][0].toUpperCase();

            if (vowels.includes(firstLetter)) {
                console.log("Goodbye " + names[i]);
            } else {
                console.log("Hello " + names[i]);
            }
        }

        let threshold = 390;

        console.log("Спосіб 2: сума ASCII-кодів літер імені.");
        console.log("Якщо сума більша за " + threshold + " - Goodbye, інакше - Hello");

        for (let i = 0; i < names.length; i++) {
            let sum = 0;
            for (let j = 0; j < names[i].length; j++) {
                sum += names[i].charCodeAt(j);
            }

            if (sum > threshold) {
                console.log("Goodbye " + names[i] + " (сума " + sum + ")");
            } else {
                console.log("Hello " + names[i] + " (сума " + sum + ")");
            }
        }
    </script>
</body>

</html>
