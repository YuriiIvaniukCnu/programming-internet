<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завданя №2</title>
    <script src="task2.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <input type="text" id="calculator-display" readonly>
    <div id="calculator-buttons">
        
        <button class="delete-button normal-button">C</button>
        <button class="delete-button normal-button">Del</button>
        <button class="normal-button">%</button>
        <button class="operation-button normal-button">÷</button>

        <button class="normal-button">7</button>

        <button class="normal-button">9</button>

        <button class="normal-button">4</button>

        <button class="normal-button">6</button>

        <button class="normal-button">1</button>
        <button class="normal-button">2</button>
        <button class="normal-button">3</button>

        <button class="normal-button">()</button>

        <button id="equals-button" class="normal-button">=</button>
