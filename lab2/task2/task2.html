<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завданя №2</title>
    <script src="task2.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../lab2.html" style="position: fixed; top: 10px; right: 10px;">Назад</a>

    <input type="text" id="calculator-display" readonly>
    <div id="calculator-buttons">
        
        <button class="delete-button normal-button" onclick="clearDisplay()">C</button>
        <button class="delete-button normal-button" onclick="deleteLast()">Del</button>
        <button class="normal-button" onclick="append('.')">.</button>
        <button class="operation-button normal-button" onclick="append('÷')">÷</button>

        <button class="normal-button" onclick="append('7')">7</button>
        <button class="normal-button" onclick="append('8')">8</button>
        <button class="normal-button" onclick="append('9')">9</button>
        <button class="operation-button normal-button" onclick="append('×')">×</button>

        <button class="normal-button" onclick="append('4')">4</button>
        <button class="normal-button" onclick="append('5')">5</button>
        <button class="normal-button" onclick="append('6')">6</button>
        <button class="operation-button normal-button" onclick="append('-')">-</button>

        <button class="normal-button" onclick="append('1')">1</button>
        <button class="normal-button" onclick="append('2')">2</button>
        <button class="normal-button" onclick="append('3')">3</button>
        <button class="operation-button normal-button" onclick="append('+')">+</button>

        <button class="normal-button" onclick="append('(')">(</button>
        <button class="normal-button" onclick="append('0')">0</button>
        <button class="normal-button" onclick="append(')')">)</button>
        <button id="equals-button" class="normal-button" onclick="calculate()">=</button>
    </div>
</body>
</html>
