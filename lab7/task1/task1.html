<body>

    <h1>Завдання №1</h1>
    <h3>Об'єкт, що описує час (години, хвилини, секунди), і функції для роботи з ним: виведення часу на екран та зміна часу на передану кількість секунд.</h3>

    <form style="display: flex; flex-direction: column; width: 300px;">
        <input type="button" value="Показати час" id="showButton"> <br>

        <label for="seconds">Кількість секунд:</label>
        <input type="number" id="seconds"> <br>

        <input type="button" value="Змінити час" id="changeButton"> <br>

        <label for="output">Час:</label>
        <input type="text" id="output" readonly>
    </form>
