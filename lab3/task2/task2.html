<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання №2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../lab3.html" style="position: fixed; top: 10px; right: 10px;">Назад</a>
    <div id="calculator">
        <div id="display">
            <input type="text" id="displayInput" readonly>
            <input type="text" id="displayOperations" readonly>
        </div>

        <div id="buttons">
            <button id="b7" style="grid-area: b7;" class="button numButton">7</button>
            <button id="b8" style="grid-area: b8;" class="button numButton">8</button>
            <button id="b9" style="grid-area: b9;" class="button numButton">9</button>
            <button id="bDel" style="grid-area: bDel;" class="button specialButton">-></button>
            <button id="bClear" style="grid-area: bClear;" class="button">C</button>
            <button id="b4" style="grid-area: b4;" class="button numButton">4</button>
            <button id="b5" style="grid-area: b5;" class="button numButton">5</button>
            <button id="b6" style="grid-area: b6;" class="button numButton">6</button>
            <button id="bMultiply" style="grid-area: bMultiply;" class="button basicOperation">×</button>
            <button id="bDivide" style="grid-area: bDivide;" class="button basicOperation">÷</button>
            <button id="b1" style="grid-area: b1;" class="button numButton">1</button>
            <button id="b2" style="grid-area: b2;" class="button numButton">2</button>
            <button id="b3" style="grid-area: b3;" class="button numButton">3</button>
            <button id="bSubtract" style="grid-area: bSubtract;" class="button basicOperation">-</button>
            <button id="bEquals" style="grid-area: bEquals;" class="button">=</button>
            <button id="bChangeSign" style="grid-area: bChangeSign;" class="button specialButton">+/-</button>
            <button id="b0" style="grid-area: b0;" class="button numButton">0</button>
            <button id="bDecimal" style="grid-area: bDecimal;" class="button numButton">.</button>
            <button id="bAdd" style="grid-area: bAdd;" class="button basicOperation">+</button>
        </div>
    </div>
</body>
</html>
